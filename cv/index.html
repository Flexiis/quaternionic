<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felix Douven — CV</title>
<meta name="description" content="CV of Felix Douven, mechatronics engineer in Eindhoven.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEEE9;--sf:#F8F7F3;--fg:#141413;--mu:#5F5E58;--ac:#E8501E;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:12px clamp(16px,3vw,32px);border-bottom:1px solid var(--fg);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.brand{display:flex;align-items:center;gap:10px;font-family:'Archivo',system-ui,sans-serif;font-weight:700;font-stretch:125%;font-size:15px;text-transform:none;letter-spacing:-.01em}
.sq{width:10px;height:10px;background:var(--ac);display:block}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.btn{padding:7px 12px;border:1px solid var(--fg)}
.btn:hover{background:var(--fg);color:var(--bg)}
.doc{flex:1;min-height:0;background:var(--sf)}
.doc object{display:block;width:100%;height:100%;border:0}
.fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;text-align:center}
.fallback p{margin:0;font-size:18px;max-width:22em}
.fallback .btn{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:14px 20px;background:var(--fg);color:var(--bg)}
.fallback .btn:hover{background:var(--ac);border-color:var(--ac);color:#fff}
</style>
</head>
<body>
  <header class="bar">  
    <a class="brand" href="../index.html"><span class="sq"></span><span>Felix Douven</span></a>
    <nav class="actions" aria-label="CV">
      <a href="../index.html">← Portfolio</a>
      <a class="btn" href="../pictures/Felix_CV_Redacted_2026.pdf" download>Download PDF ↓</a>
    </nav>
  </header>
  <main class="doc">
    <object data="../pictures/Felix_CV_Redacted_2026.pdf#view=FitH" type="application/pdf" aria-label="Felix Douven CV">
      <div class="fallback">
        <p>Your browser can't show the PDF inline.</p>
        <a class="btn" href="../pictures/Felix_CV_Redacted_2026.pdf" target="_blank" rel="noopener">Open CV ↗</a>
      </div>
    </object>
  </main>
</body>
</html>
